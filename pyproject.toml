[project]
name = "github-skills-dataset"
version = "0.1.0"
description = "Build validated SKILL.md dataset for Kaggle"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.40.0",
    "cachetta>=0.6.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pyyaml>=6.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.67.3",
    "claude-agent-sdk>=0.1.50",
    "openai>=2.29.0",
    "dspy>=3.1.3",
    "karat",
    "scikit-learn>=1.8.0",
    "httpx>=0.28.1",
    "xgboost>=3.2.0",
    "imbalanced-learn>=0.14.1",
]

[project.optional-dependencies]
agent = [
    "claude-agent-sdk",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
skills-dataset = "github_skills_dataset.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests hitting real LLM endpoints",
]

[tool.hatch.build.targets.wheel]
packages = ["src/github_skills_dataset"]

[tool.hatch.build.targets.wheel.force-include]
"src/github_skills_dataset/filter/validation_prompt.txt" = "github_skills_dataset/filter/validation_prompt.txt"

[tool.uv.sources]
karat = { git = "ssh://git@github.com/thekevinscott/karat.git" }
